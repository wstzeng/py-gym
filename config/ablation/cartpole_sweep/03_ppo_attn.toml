# Arm 03_ppo_attn: same PPO, TransformerCritic in the critic slot.
# Four feature tokens of 8 values, one encoder layer: enough to exercise
# attention without making CartPole slow.
[env]
id = "CartPole-v1"

[env.default]
max_episode_steps = 500

[agent]
type = "PPOAgent"

[agent.encoder]
type = "VectorEncoder"
layers = [
    { type = "Linear", out_features = 32 },
    { type = "LeakyReLU" },
]

[agent.policy]
type = "ActorCriticPolicy"

[agent.policy.handler]
type = "CategoricalHandler"

[agent.policy.handler.params]
action_dim = 2

[agent.policy.actor]
type = "Sequential"
layers = [
    { type = "Linear", out_features = 2 },
]

# 03_ppo_attn: 4 tokens x 8 features -> d_model 16, 4 heads
[agent.policy.critic]
type = "TransformerCritic"
params = { d_model = 16, nhead = 4, depth = 1, n_tokens = 4, dim_feedforward = 32 }

[agent.buffer]
type = "TrajectoryBuffer"

[hyper_params]
eps_clip = 0.2
k_epochs = 4
critic_weight = 0.5
entropy_weight = 0.01
gamma = 0.99
gae_lambda = 0.95

[hyper_params.optimizer]
type = "AdamW"

[hyper_params.optimizer.params]
weight_decay = 0.01
lrs = { default = 0.001, actor = 0.0003 }

[hyper_params.criterion]
critic_loss = "MSELoss"
