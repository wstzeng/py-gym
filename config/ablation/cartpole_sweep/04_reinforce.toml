# Arm 04_reinforce: the non-actor-critic baseline, same encoder and actor.
[env]
id = "CartPole-v1"

[env.default]
max_episode_steps = 500

[agent]
type = "ReinforceAgent"

[agent.encoder]
type = "VectorEncoder"
layers = [
    { type = "Linear", out_features = 32 },
    { type = "LeakyReLU" },
]

[agent.policy]
type = "ActorPolicy"

[agent.policy.handler]
type = "CategoricalHandler"

[agent.policy.handler.params]
action_dim = 2

[agent.policy.actor]
type = "Sequential"
layers = [
    { type = "Linear", out_features = 2 },
]

[agent.buffer]
type = "TrajectoryBuffer"

[hyper_params]
gamma = 0.99

[hyper_params.optimizer]
type = "Adam"

[hyper_params.optimizer.params]
lrs = { default = 0.001 }
