[env]
id = "Pendulum-v1"
state_dim = 3
default = {}
training = {}
testing = { render_mode = "human" }

[agent]
type = "ReinforceAgent"

[agent.components.encoder]
type = "VectorEncoder"
layers = [
    { type = "Linear", out_features = 64 },
    { type = "LeakyReLU" }
]

[agent.components.policy]
type = "ActorPolicy"
feature_dim = 64

[agent.components.policy.components.actor]
type = "Sequential"
layers = [{ type = "Linear", out_features = 1 }]

[agent.components.policy.components.handler]
type = "NormalHandler"

[agent.components.policy.components.handler.params]
action_dim = 1
action_low = -2.0
action_high = 2.0

[agent.components.buffer]
type = "TrajectoryBuffer"

[hyper_params]
eps_clip = 0.2
k_epochs = 10
critic_weight = 0.5
entropy_weight = 0.01
gamma = 0.9

[hyper_params.optimizer]
type = "Adam"

[hyper_params.optimizer.params.lrs]
default = 3e-4
critic = 1e-3

[hyper_params.criterion]
critic_loss = "SmoothL1Loss"
