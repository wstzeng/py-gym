[project]
name = "gym"
version = "0.1.0"
description = ""
authors = [
    {name = "wstzeng",email = "danieltzeng088@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy (>=1.26.4,<2.0.0)",
    "matplotlib (>=3.10.1,<4.0.0)",
    "gymnasium (>=1.1.1,<2.0.0)",
    "pygame (>=2.6.0,<3.0.0)",
    "setuptools (>=65.0.0,<70.0.0)",
    "rich (>=14.2.0,<15.0.0)",
    "tomli-w (>=1.2.0,<2.0.0)",
    "torch (==2.6.0+cpu) ; extra != 'cuda'",
]

[project.optional-dependencies]
# Box2D environments (e.g. LunarLander-v3) also need the system `swig`
# build tool on PATH before this extra is installed. See README.
box2d = [
    "gymnasium[box2d] (>=1.1.1,<2.0.0)",
]
cuda = [
    "torch (==2.6.0+cu124)",
]

[tool.poetry]
package-mode = false
packages = [
    { include = "agent" },
    { include = "utils" }
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: builds real Gymnasium environments; Box2D cases skip without it",
]

[tool.poetry.dependencies]
torch = [
    { markers = "extra != 'cuda'", source = "pytorch-cpu"},
    { markers = "extra == 'cuda'", source = "pytorch-cuda"},
 ]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
