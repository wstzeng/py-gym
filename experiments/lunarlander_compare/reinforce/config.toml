[env]
id = "LunarLander-v3"

[env.default]
continuous = true

[env.training]

[env.testing]
render_mode = "human"

[agent]
type = "ReinforceAgent"

[agent.encoder]
type = "VectorEncoder"
layers = [
    { type = "Linear", out_features = 64 },
    { type = "LeakyReLU" },
    { type = "Linear", out_features = 64 },
    { type = "LeakyReLU" },
]

[agent.policy]
type = "ActorPolicy"

[agent.policy.handler]
type = "NormalHandler"

[agent.policy.handler.params]
action_dim = 2
action_low = -1.0
action_high = 1.0

[agent.policy.actor]
type = "Sequential"
layers = [
    { type = "Linear", out_features = 2 },
]

[agent.buffer]
type = "TrajectoryBuffer"

[hyper_params]
gamma = 0.999

[hyper_params.optimizer]
type = "Adam"

[hyper_params.optimizer.params.lrs]
default = 0.0003

[metadata]
iterations = 800
episodes = 20
device = "cpu"
timestamp = "20261028_182450"
dry_run = true
