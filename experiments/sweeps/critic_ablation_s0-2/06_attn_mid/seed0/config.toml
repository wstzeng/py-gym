[env]
id = "LunarLander-v3"

[env.default]
continuous = true

[env.training]

[env.testing]
render_mode = "human"

[agent]
type = "PPOAgent"

[agent.encoder]
type = "VectorEncoder"
layers = [
    { type = "Linear", out_features = 64 },
    { type = "LeakyReLU" },
    { type = "Linear", out_features = 64 },
    { type = "LeakyReLU" },
]

[agent.policy]
type = "ActorCriticPolicy"

[agent.policy.handler]
type = "NormalHandler"

[agent.policy.handler.params]
action_dim = 2
action_low = -1.0
action_high = 1.0

[agent.policy.actor]
type = "Sequential"
layers = [
    { type = "Linear", out_features = 2 },
]

[agent.policy.critic]
type = "TransformerCritic"

[agent.policy.critic.params]
d_model = 32
nhead = 4
depth = 2
n_tokens = 8
dim_feedforward = 64

[agent.buffer]
type = "TrajectoryBuffer"

[hyper_params]
eps_clip = 0.2
k_epochs = 10
critic_weight = 0.5
entropy_weight = 0.001
gamma = 0.999
gae_lambda = 0.98

[hyper_params.optimizer]
type = "AdamW"

[hyper_params.optimizer.params]
weight_decay = 0.0001

[hyper_params.optimizer.params.lrs]
default = 0.0003

[hyper_params.criterion]
critic_loss = "SmoothL1Loss"

[metadata]
iterations = 600
episodes = 20
device = "cpu"
timestamp = "20261029_052000"
dry_run = false
seed = 0
